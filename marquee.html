<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marquee</title>
</head>
<body>
    <h1>Marquee Tag in Html</h1>

    <marquee behavior="" direction="up">
        <h2>Breaking News :Jadeja go to RR</h2>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Eius, doloribus.</p>
    </marquee>

    <marquee behavior="alternate" direction="right" scrollamount="60" width="500" >
        <h1>I am webTech developer</h1>
       
    </marquee>

    <marquee behavior="" direction="right" scrollamount="60">
        <img src="https://cdn.pixabay.com/animation/2022/08/16/14/11/14-11-30-461_512.gif" alt="" width="100">
    </marquee>
    <marquee behavior="" direction="" scrollamount="40">
        <img src="https://i.giphy.com/fstV57yumJ3dMUaYPr.webp" alt="" height="200">
        <img src="https://i.pinimg.com/originals/c1/0f/09/c10f09d7fe6f756c8abf441c92a0ba3c.gif" alt="">
    </marquee>

    <marquee behavior="" direction="Down" scrollamount="30"><h1>Down</h1>
    </marquee>

    <marquee behavior="alternate" loop="4" direction="right" scrollamount="60">
         <img src="./tuf.webp" alt="" height="100">

    </marquee>


    <marquee behavior="" loop="3" direction="right" scrollamount="60" >Iliyas
        <img src="https://i.giphy.com/fTy1jXk20LGkHbUBJg.webp" alt="" height="100">
    </marquee >
</body>
</html>
