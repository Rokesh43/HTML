<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student form</title>
    <style>
        .form{
            background-color: bisque;
        }
    </style>
</head>
<body>
    <h1>Student form</h1>
    <form action="" method="" autocomplete="off" class="form">
        <fieldset>
         <legend>Student information</legend>   
        <label for="sn">Student name :</label>
        <input type="text" placeholder="Enter the name" id="sn" name="sname" value="" required>
        <br><br>

        <label for="pn" >Phone number :</label>
        <input type="number" placeholder="Enter the phone number" id="pn" name="phonenumber" value="" required maxlength="10">
        <br><br>

        <label for="pass">Password :</label>
        <input type="password" id="pass" placeholder="Enter your password" name="password" value="">
        <br><br>

        <label for="age">Student Age :</label>
        <input type="number" name="age" id="age" placeholder="Enter your age" value="">
        <br><br>

        <label for="email">Student Email :</label>
        <input type="email" name="email" id="email" placeholder="Enter your email" value="student@123" readonly>
        <br><br>

        <label for="">Subjects</label>
        <br><br>
        <label for="html">HTML</label>
        <input type="checkbox" name="html" id="html" value="html">
        
        <label for="css">CSS</label>
        <input type="checkbox" name="css" id="css" value="css">

        <label for="js">Java Script</label>
        <input type="checkbox" name="js" id="js" value="javascript">
        <br><br>

        <label for="">Gender</label>
        <br><br>

        <label for="male">Male</label>
        <input type="radio" name="gender" id="male" value="male">

        <label for="female">Female</label>
        <input type="radio" name="gender" id="female" value="female">

        <label for="others">Others</label>
        <input type="radio" name="gender" id="others" value="others">
        <br><br>
        <label for="address">Enter your Address :</label>
        <br><br>
        <textarea name="address" id="address" placeholder="Enter your address" rows="10" cols="100"></textarea>
        <br><br>
        <label for="dob">Date of birth :</label>
        <input type="date" name="dob" id="dob" value="">
        <br><br>

        <label for="sc">Select Course :</label>
        <select name="selectcouse" id="sc" >
            <option value="javafullstack">Java Full stack</option>
            <option value="pythonfullstack">Python Full stack</option>
            <option value="mernstack">Mern stack</option>
        </select>
        <br><br>
        <label for="file">Choose file</label>
        <input type="file" name="file" id="file">


        
        <br><br><br>
        <button type="submit">SignUp</button>
        <button type="reset">Reset</button>
        </fieldset>
    </form>
</body>
</html>
