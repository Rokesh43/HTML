<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>


</head>
<body>
    <h1>Exercise</h1>

    <table border="1" cellspacing="10" cellpadding="5">
        <caption>Cartoon Characters</caption>

       <tr>
         <th>Character Image</th>
        <th>Character Name</th>
        <th>Known for</th>
       </tr>
       <tr>
        <td>
            <img src="https://media.tenor.com/9YXOtKc6D4sAAAAM/tom-eye-tom-and-jerry.gif" alt="" width="200">
        </td>
        <td>Tom</td>
        <td>
            <ul type="circle">
                <li>chasing jerry</li>
                <li>Loves Milk</li>
                <li>gets tricked by jerry</li>
            </ul>
        </td>
       </tr>

       <tr>
        <td>
            <img src="https://media0.giphy.com/media/8VbpkTaUHYm4CJ4WGm/source.gif" alt="" height="150" >
        </td>
        <td>Jerry</td>
        <td>
            <ul type="square">
                <li>Love cheese</li>
                <li>Tricks tom</li>
                <li>Small and smart</li>
            </ul>
        </td>
       </tr>

       <tr>
        <td>
            <img src="https://media.tenor.com/ZgIRCUMksogAAAAM/sing-crayon-shin-chan.gif" alt="" height="150">
            
        </td>
        <td>shinchan</td>
        <td>
            <ul>
                <li>Funny dialogue</li>
                <li>Fav Cartoon</li>
                <li>small boy</li>
            </ul>
        </td>
       </tr>


    </table>


    <h2>table 2</h2>

    <table border="1" width="500">
        <tr>
            <td colspan="2">1</td>
            <td rowspan="2">2</td>
        </tr>
        <tr>
            <td colspan="2">3</td>
        </tr>
        <tr>
            <td>4</td> 
            <td>5</td>
            <td>6</td>
        </tr>
        <tr>
            <td colspan="2">7</td>
            <td rowspan="2">8</td>
        </tr>
        <tr>
            <td>9</td>
            <td>10</td>
        </tr>
    </table>
    
</body>
</html>
